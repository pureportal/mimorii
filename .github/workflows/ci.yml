name: CI

run-name: CI / ${{ github.head_ref || github.ref_name }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: 10.33.2

jobs:
  workflow-lint:
    name: Validate workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  quality:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MIMORII_ALLOW_PRIVATE_DIRECT_TARGETS: "true"
      MIMORII_CORS_ORIGINS: http://localhost:5180
      MIMORII_DB_HOST: 127.0.0.1
      MIMORII_DB_NAME: mimorii
      MIMORII_DB_PASSWORD: mimorii-test-password
      MIMORII_DB_PORT: "5432"
      MIMORII_DB_USER: mimorii
      MIMORII_JWT_SECRET: test-only-secret-with-at-least-thirty-two-characters
      MIMORII_SCHEDULER_ENABLED: "false"
      NODE_ENV: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mimorii
          POSTGRES_PASSWORD: mimorii-test-password
          POSTGRES_USER: mimorii
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mimorii -d mimorii"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/agent-deskopt -> target
            apps/agent-mobile -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Build release artifacts
        run: pnpm build

  windows-agent-deskopt:
    name: Test Windows collector
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/agent-deskopt -> target

      - name: Test collector
        run: cargo test --locked --manifest-path apps/agent-deskopt/Cargo.toml

  container:
    name: Validate container deployment
    needs:
      - quality
      - workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ./Dockerfile
          load: true
          platforms: linux/amd64
          pull: true
          push: false
          tags: mimorii:local
          cache-from: type=gha,scope=mimorii

      - name: Start Compose deployment
        run: docker compose --env-file .env.example up --detach --no-build --wait --wait-timeout 120

      - name: Verify application health
        run: curl --fail --silent --show-error --output /dev/null http://127.0.0.1:4310/api/health

      - name: Show deployment logs
        if: failure()
        run: docker compose --env-file .env.example logs --no-color

      - name: Stop Compose deployment
        if: always()
        run: docker compose --env-file .env.example down --volumes --remove-orphans
