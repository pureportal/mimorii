name: CI

run-name: CI / ${{ github.head_ref || github.ref_name }}

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      delivery_gate:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.delivery_gate && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !inputs.delivery_gate }}

env:
  NODE_VERSION: "24"
  PNPM_VERSION: 10.33.2

jobs:
  workflow-lint:
    name: Validate workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Run actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  quality:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MIMORII_ALLOW_PRIVATE_DIRECT_TARGETS: "true"
      MIMORII_CORS_ORIGINS: http://localhost:5180
      MIMORII_DB_HOST: 127.0.0.1
      MIMORII_DB_NAME: mimorii
      MIMORII_DB_PASSWORD: mimorii-test-password
      MIMORII_DB_PORT: "5432"
      MIMORII_DB_USER: mimorii
      MIMORII_JWT_SECRET: test-only-secret-with-at-least-thirty-two-characters
      MIMORII_SCHEDULER_ENABLED: "false"
      NODE_ENV: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mimorii
          POSTGRES_PASSWORD: mimorii-test-password
          POSTGRES_USER: mimorii
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mimorii -d mimorii"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            apps/agent-desktop -> target
            apps/agent-mobile -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Build release artifacts
        run: pnpm build

  windows-agent-desktop:
    name: Test Windows agent and installer
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Set up .NET
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: "8.0.x"

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            apps/agent-desktop -> target
            apps/agent-desktop-ui -> target

      - name: Test collector
        run: cargo test --locked --manifest-path apps/agent-desktop/Cargo.toml -- --test-threads=1

      - name: Build Windows agent
        run: |
          cargo build --locked --release --manifest-path apps/agent-desktop/Cargo.toml
          cargo build --locked --release --manifest-path apps/agent-desktop-ui/Cargo.toml

      - name: Build installer lifecycle packages
        shell: pwsh
        run: |
          node scripts/build-windows-agent-installer.mjs --skip-agent-build --version 1.0.0 --output dist/test/windows-base
          node scripts/build-windows-agent-installer.mjs --skip-agent-build --output dist/test/windows-upgrade
          node scripts/build-windows-agent-installer.mjs --skip-agent-build --output dist/test/windows-reinstall

      - name: Test installer lifecycle
        shell: pwsh
        run: |
          & apps/agent-desktop/installer/windows/Test-Installer.ps1 `
            -BaseMsi dist/test/windows-base/mimorii-agent-windows-x64.msi `
            -UpgradeMsi dist/test/windows-upgrade/mimorii-agent-windows-x64.msi `
            -ReinstallMsi dist/test/windows-reinstall/mimorii-agent-windows-x64.msi `
            -AgentExecutable apps/agent-desktop/target/release/mimorii-agent-desktop.exe

  agent-container:
    name: Validate check agent container
    needs:
      - quality
      - workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Validate agent Compose configuration
        env:
          MIMORII_AGENT_KEY: mim_agent_12345678901234567890123456789012
          MIMORII_AGENT_SERVER: https://mimorii.example.com/api
        run: docker compose -f apps/agent-desktop/compose.yaml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build agent image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ./apps/agent-desktop
          file: ./apps/agent-desktop/Dockerfile
          load: true
          platforms: linux/amd64
          pull: true
          push: false
          tags: mimorii-check-agent:local
          cache-from: type=gha,scope=mimorii-check-agent

      - name: Validate agent image
        run: |
          version="$(awk -F '"' '/^version = / { print $2; exit }' apps/agent-desktop/Cargo.toml)"
          test "$(docker run --rm mimorii-check-agent:local --version)" = "mimorii-agent-desktop $version"
          test "$(docker image inspect --format '{{.Config.User}}' mimorii-check-agent:local)" = "10001:10001"
          test "$(docker image inspect --format '{{json .Config.Cmd}}' mimorii-check-agent:local)" = '["check-runner"]'
          help="$(docker run --rm mimorii-check-agent:local --help)"
          [[ "$help" == *check-runner* ]]

  container:
    name: Validate server container
    needs:
      - quality
      - workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Validate Compose configuration
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example -f compose.yaml -f compose.firebase.yaml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ./Dockerfile
          load: true
          platforms: linux/amd64
          pull: true
          push: false
          tags: mimorii-server:local
          cache-from: type=gha,scope=mimorii-server

      - name: Start Compose deployment
        run: docker compose --env-file .env.example up --detach --no-build --wait --wait-timeout 120

      - name: Verify application health
        run: curl --fail --silent --show-error --output /dev/null http://127.0.0.1:4310/api/health

      - name: Show deployment logs
        if: failure()
        run: docker compose --env-file .env.example logs --no-color

      - name: Stop Compose deployment
        if: always()
        run: docker compose --env-file .env.example down --volumes --remove-orphans
