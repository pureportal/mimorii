name: Build client releases

run-name: Clients / ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: clients-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: 10.33.2
  JAVA_VERSION: "21"
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS_VERSION: 36.1.0
  ANDROID_NDK_VERSION: 30.0.14904198

jobs:
  android:
    name: Signed Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      MIMORII_ARTIFACT_DIR: ${{ github.workspace }}/dist/clients/android
      MIMORII_FIREBASE_API_KEY: ${{ vars.MIMORII_FIREBASE_API_KEY }}
      MIMORII_FIREBASE_APPLICATION_ID: ${{ vars.MIMORII_FIREBASE_APPLICATION_ID }}
      MIMORII_FIREBASE_PROJECT_ID: ${{ vars.MIMORII_FIREBASE_PROJECT_ID }}
      MIMORII_FIREBASE_SENDER_ID: ${{ vars.MIMORII_FIREBASE_SENDER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri -> target

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_COMPILE_SDK }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}
            ndk;${{ env.ANDROID_NDK_VERSION }}

      - name: Configure Android toolchain
        run: |
          ndk_home="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          if [ ! -d "$ndk_home" ]; then
            echo "::error::Android NDK was not installed at $ndk_home."
            exit 1
          fi
          echo "NDK_HOME=$ndk_home" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk_home" >> "$GITHUB_ENV"

      - name: Validate Android build variables
        run: |
          firebase_values=(
            "$MIMORII_FIREBASE_API_KEY"
            "$MIMORII_FIREBASE_APPLICATION_ID"
            "$MIMORII_FIREBASE_PROJECT_ID"
            "$MIMORII_FIREBASE_SENDER_ID"
          )
          configured_count=0
          for value in "${firebase_values[@]}"; do
            if [ -n "$value" ]; then
              configured_count=$((configured_count + 1))
            fi
          done
          if [ "$configured_count" -ne 0 ] && [ "$configured_count" -ne 4 ]; then
            echo "::error::Configure all four MIMORII_FIREBASE_* Actions variables or leave all four unset."
            exit 1
          fi

      - name: Configure Android release signing
        run: |
          signing_values=(
            "$ANDROID_KEYSTORE_BASE64"
            "$ANDROID_SIGNING_STORE_PASSWORD"
            "$ANDROID_SIGNING_KEY_ALIAS"
            "$ANDROID_SIGNING_KEY_PASSWORD"
          )
          missing_names=()
          signing_names=(
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
          )
          for index in "${!signing_values[@]}"; do
            if [ -z "${signing_values[$index]}" ]; then
              missing_names+=("${signing_names[$index]}")
            fi
          done
          if [ ${#missing_names[@]} -gt 0 ]; then
            echo "::error::Missing Android signing secrets: ${missing_names[*]}"
            exit 1
          fi

          signing_directory="$RUNNER_TEMP/android-signing"
          signing_store="$signing_directory/release.keystore"
          mkdir -p "$signing_directory"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_store"
          chmod 600 "$signing_store"
          if [ ! -s "$signing_store" ]; then
            echo "::error::Decoded Android keystore is empty."
            exit 1
          fi
          keytool -list \
            -keystore "$signing_store" \
            -storepass:env ANDROID_SIGNING_STORE_PASSWORD \
            -alias "$ANDROID_SIGNING_KEY_ALIAS" > /dev/null
          echo "ANDROID_SIGNING_STORE_FILE=$signing_store" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate client configuration
        id: metadata
        run: |
          pnpm clients:validate
          version="$(node -p "require('./apps/client/package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match client version v$version."
            exit 1
          fi
          echo "artifact_name=mimorii-android-v${version}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Confirm clean Android initialization
        run: |
          if [ -e apps/client/src-tauri/gen/android ]; then
            echo "::error::The Android project must be generated from the clean checkout."
            exit 1
          fi

      - name: Initialize Android project
        run: pnpm tauri:android:init

      - name: Test Android collector
        working-directory: apps/client/src-tauri/gen/android
        run: >-
          ./gradlew
          :tauri-plugin-agent-mobile:testDebugUnitTest
          --no-daemon
          --console=plain

      - name: Build and sign Android release
        id: android_artifacts
        run: pnpm tauri:android:release

      - name: Lint Android release
        working-directory: apps/client/src-tauri/gen/android
        run: >-
          ./gradlew
          :tauri-plugin-agent-mobile:lintRelease
          :tauri-plugin-push:lintRelease
          :app:lintUniversalRelease
          --no-daemon
          --console=plain

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            ${{ steps.android_artifacts.outputs.artifact_path }}
            ${{ steps.android_artifacts.outputs.checksum_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Attest Android artifacts
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.android_artifacts.outputs.artifact_path }}

      - name: Remove Android signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/android-signing/release.keystore"
          rmdir "$RUNNER_TEMP/android-signing" 2>/dev/null || true

  windows:
    name: Signed Windows installers
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    env:
      MIMORII_ARTIFACT_DIR: ${{ github.workspace }}/dist/clients/windows
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate client configuration
        id: metadata
        run: |
          pnpm clients:validate
          version="$(node -p "require('./apps/client/package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match client version v$version."
            exit 1
          fi
          echo "artifact_name=mimorii-windows-v${version}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Import Windows signing certificate
        shell: pwsh
        run: |
          $missingNames = @()
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            $missingNames += "WINDOWS_CERTIFICATE_BASE64"
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            $missingNames += "WINDOWS_CERTIFICATE_PASSWORD"
          }
          if ($missingNames.Count -gt 0) {
            throw "Missing Windows signing secrets: $($missingNames -join ', ')"
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "mimorii-code-signing.pfx"
          $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $importOptions = @{
            FilePath = $certificatePath
            CertStoreLocation = "Cert:\CurrentUser\My"
            Password = $password
          }
          $importedCertificates = @(Import-PfxCertificate @importOptions)
          Remove-Item -LiteralPath $certificatePath -Force
          "WINDOWS_IMPORTED_CERTIFICATES=$($importedCertificates.Thumbprint -join ',')" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          $codeSigningOid = "1.3.6.1.5.5.7.3.3"
          $certificate = $importedCertificates | Where-Object {
            $candidate = $_
            $enhancedKeyUsageOids = @(
              $candidate.Extensions |
                Where-Object {
                  $_ -is [Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]
                } |
                ForEach-Object { $_.EnhancedKeyUsages } |
                ForEach-Object { $_.Value }
            )
            $candidate.HasPrivateKey -and $enhancedKeyUsageOids -contains $codeSigningOid
          } | Select-Object -First 1
          if ($null -eq $certificate) {
            throw "The Windows certificate archive does not contain a private key valid for code signing."
          }
          $now = Get-Date
          if ($certificate.NotBefore -gt $now -or $certificate.NotAfter -lt $now) {
            throw "The Windows code-signing certificate is not currently valid."
          }

          "WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows installers
        run: pnpm tauri:windows:build

      - name: Verify Windows signatures
        shell: pwsh
        run: |
          $bundleDirectory = "apps/client/src-tauri/target/release/bundle"
          $paths = @("apps/client/src-tauri/target/release/Mimorii.exe")
          $paths += @(Get-ChildItem -Path $bundleDirectory -Recurse -File -Filter "*.msi").FullName
          $paths += @(Get-ChildItem -Path $bundleDirectory -Recurse -File -Filter "*-setup.exe").FullName
          if ($paths.Count -ne 3) {
            throw "Expected the Mimorii executable, one MSI, and one NSIS installer; found $($paths.Count) files."
          }
          foreach ($path in $paths) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Expected signed file was not produced: $path"
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $path: $($signature.Status)"
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              throw "The Authenticode signature is not timestamped: $path"
            }
          }

      - name: Stage Windows artifacts
        id: windows_artifacts
        run: pnpm tauri:windows:stage

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            ${{ steps.windows_artifacts.outputs.artifact_paths }}
            ${{ steps.windows_artifacts.outputs.checksum_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Generate Windows SBOM
        uses: anchore/sbom-action@v0
        with:
          artifact-name: sbom-${{ steps.metadata.outputs.artifact_name }}.spdx.json
          output-file: ${{ runner.temp }}/mimorii-windows.spdx.json
          format: spdx-json
          upload-release-assets: false

      - name: Attest Windows artifacts
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.windows_artifacts.outputs.artifact_paths }}

      - name: Attest Windows SBOM
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-sbom@v3
        with:
          subject-path: ${{ steps.windows_artifacts.outputs.artifact_paths }}
          sbom-path: ${{ runner.temp }}/mimorii-windows.spdx.json

      - name: Remove imported Windows certificates
        if: always()
        shell: pwsh
        run: |
          foreach ($thumbprint in ($env:WINDOWS_IMPORTED_CERTIFICATES -split ',')) {
            if (-not [string]::IsNullOrWhiteSpace($thumbprint)) {
              Remove-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" -Force -ErrorAction SilentlyContinue
            }
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "mimorii-code-signing.pfx"
          Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue

  publish:
    name: Publish client release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - android
      - windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.android.outputs.artifact_name }}
          path: release-assets

      - name: Download Windows artifacts
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.windows.outputs.artifact_name }}
          path: release-assets

      - name: Publish GitHub release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f | sort)
          if [ ${#assets[@]} -ne 5 ]; then
            echo "::error::Expected five client release assets, found ${#assets[@]}."
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "Mimorii $GITHUB_REF_NAME"
          fi
