name: Release

run-name: Release / ${{ github.sha }}

on:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: 10.33.2
  JAVA_VERSION: "21"
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS_VERSION: 36.1.0
  ANDROID_NDK_VERSION: 30.0.14904198
  REGISTRY: ghcr.io

jobs:
  metadata:
    name: Detect version release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
      release: ${{ steps.release.outputs.release }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Fetch release comparison commit
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          if [[ ! "$BASE_SHA" =~ ^0{40}$ ]] && ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi

      - name: Validate release metadata
        id: release
        env:
          BASE_SHA: ${{ github.event.before }}
        run: node scripts/validate-release.mjs --base "$BASE_SHA"

  validation:
    name: Validate main commit
    needs: metadata
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      delivery_gate: true

  android:
    name: Android client and mobile agent
    if: needs.metadata.outputs.release == 'true'
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      MIMORII_ARTIFACT_DIR: ${{ github.workspace }}/dist/release/android
      MIMORII_FIREBASE_API_KEY: ${{ vars.MIMORII_FIREBASE_API_KEY }}
      MIMORII_FIREBASE_APPLICATION_ID: ${{ vars.MIMORII_FIREBASE_APPLICATION_ID }}
      MIMORII_FIREBASE_PROJECT_ID: ${{ vars.MIMORII_FIREBASE_PROJECT_ID }}
      MIMORII_FIREBASE_SENDER_ID: ${{ vars.MIMORII_FIREBASE_SENDER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: apps/client/src-tauri -> target

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_COMPILE_SDK }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}
            ndk;${{ env.ANDROID_NDK_VERSION }}

      - name: Configure Android toolchain
        run: |
          ndk_home="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          if [ ! -d "$ndk_home" ]; then
            echo "::error::Android NDK was not installed at $ndk_home."
            exit 1
          fi
          echo "NDK_HOME=$ndk_home" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk_home" >> "$GITHUB_ENV"

      - name: Validate Android build variables
        run: |
          firebase_values=(
            "$MIMORII_FIREBASE_API_KEY"
            "$MIMORII_FIREBASE_APPLICATION_ID"
            "$MIMORII_FIREBASE_PROJECT_ID"
            "$MIMORII_FIREBASE_SENDER_ID"
          )
          configured_count=0
          for value in "${firebase_values[@]}"; do
            if [ -n "$value" ]; then
              configured_count=$((configured_count + 1))
            fi
          done
          if [ "$configured_count" -ne 0 ] && [ "$configured_count" -ne 4 ]; then
            echo "::error::Configure all four MIMORII_FIREBASE_* Actions variables or leave all four unset."
            exit 1
          fi

      - name: Configure Android release signing
        run: |
          signing_values=(
            "$ANDROID_KEYSTORE_BASE64"
            "$ANDROID_SIGNING_STORE_PASSWORD"
            "$ANDROID_SIGNING_KEY_ALIAS"
            "$ANDROID_SIGNING_KEY_PASSWORD"
          )
          signing_names=(
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
          )
          missing_names=()
          for index in "${!signing_values[@]}"; do
            if [ -z "${signing_values[$index]}" ]; then
              missing_names+=("${signing_names[$index]}")
            fi
          done
          if [ ${#missing_names[@]} -gt 0 ]; then
            echo "::error::Missing Android signing secrets: ${missing_names[*]}"
            exit 1
          fi

          signing_directory="$RUNNER_TEMP/android-signing"
          signing_store="$signing_directory/release.keystore"
          mkdir -p "$signing_directory"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_store"
          chmod 600 "$signing_store"
          if [ ! -s "$signing_store" ]; then
            echo "::error::Decoded Android keystore is empty."
            exit 1
          fi
          keytool -list \
            -keystore "$signing_store" \
            -storepass:env ANDROID_SIGNING_STORE_PASSWORD \
            -alias "$ANDROID_SIGNING_KEY_ALIAS" > /dev/null
          echo "ANDROID_SIGNING_STORE_FILE=$signing_store" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Confirm clean Android initialization
        run: |
          if [ -e apps/client/src-tauri/gen/android ]; then
            echo "::error::The Android project must be generated from the clean checkout."
            exit 1
          fi

      - name: Initialize Android project
        run: pnpm tauri:android:init

      - name: Build and sign Android release
        id: android_artifacts
        run: pnpm tauri:android:release

      - name: Test Android collector
        working-directory: apps/client/src-tauri/gen/android
        run: >-
          ./gradlew
          :tauri-plugin-agent-mobile:testDebugUnitTest
          --no-daemon
          --console=plain

      - name: Lint Android release
        working-directory: apps/client/src-tauri/gen/android
        run: >-
          ./gradlew
          :tauri-plugin-agent-mobile:lintRelease
          :tauri-plugin-push:lintRelease
          :app:lintUniversalRelease
          --no-daemon
          --console=plain

      - name: Name Android artifact
        id: artifact
        run: echo "name=mimorii-android-v${{ needs.metadata.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            ${{ steps.android_artifacts.outputs.artifact_path }}
            ${{ steps.android_artifacts.outputs.checksum_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Attest Android APK
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: ${{ steps.android_artifacts.outputs.artifact_path }}

      - name: Remove Android signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/android-signing/release.keystore"
          rmdir "$RUNNER_TEMP/android-signing" 2>/dev/null || true

  ubuntu:
    name: Ubuntu x64 client and agent
    if: needs.metadata.outputs.release == 'true'
    needs: metadata
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    env:
      MIMORII_ARTIFACT_DIR: ${{ github.workspace }}/dist/release/ubuntu

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            apps/agent-desktop -> target
            apps/client/src-tauri -> target

      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and stage Ubuntu client
        id: ubuntu_client_artifacts
        run: pnpm tauri:ubuntu:release

      - name: Verify Ubuntu installer
        run: |
          installer="${{ steps.ubuntu_client_artifacts.outputs.artifact_path }}"
          test "$(dpkg-deb --field "$installer" Architecture)" = "amd64"
          test "$(dpkg-deb --field "$installer" Version)" = "${{ needs.metadata.outputs.version }}"
          dpkg-deb --contents "$installer" > "$RUNNER_TEMP/mimorii-ubuntu-contents.txt"
          grep --quiet '/Mimorii$' "$RUNNER_TEMP/mimorii-ubuntu-contents.txt"

      - name: Build Linux agent
        run: cargo build --locked --release --manifest-path apps/agent-desktop/Cargo.toml

      - name: Verify Linux agent
        run: |
          binary=apps/agent-desktop/target/release/mimorii-agent-desktop
          test "$("$binary" --version)" = "mimorii-agent-desktop ${{ needs.metadata.outputs.version }}"
          readelf --file-header "$binary" | grep --quiet 'Class:.*ELF64'
          readelf --file-header "$binary" | grep --quiet 'Machine:.*Advanced Micro Devices X86-64'

      - name: Package Linux agent
        id: agent_artifacts
        run: |
          version="${{ needs.metadata.outputs.version }}"
          artifact="mimorii-agent-v${version}-linux-x64.tar.gz"
          checksum="mimorii-agent-v${version}-linux-x64.sha256"
          package_directory="$RUNNER_TEMP/mimorii-agent-linux-x64"
          output_directory="$GITHUB_WORKSPACE/dist/release/linux-agent"
          mkdir -p "$package_directory" "$output_directory"
          install -m 0755 \
            apps/agent-desktop/target/release/mimorii-agent-desktop \
            "$package_directory/mimorii-agent-desktop"
          tar \
            --create \
            --file=- \
            --format=posix \
            --group=0 \
            --mtime="@$(git show --no-patch --format=%ct "$GITHUB_SHA")" \
            --numeric-owner \
            --owner=0 \
            --sort=name \
            --directory="$package_directory" \
            mimorii-agent-desktop | gzip -9n > "$output_directory/$artifact"
          sha256sum "$output_directory/$artifact" | sed "s#  .*#  $artifact#" > "$output_directory/$checksum"
          echo "artifact_path=$output_directory/$artifact" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$output_directory/$checksum" >> "$GITHUB_OUTPUT"

      - name: Name Ubuntu artifact
        id: artifact
        run: echo "name=mimorii-ubuntu-v${{ needs.metadata.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Upload Ubuntu artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            ${{ steps.ubuntu_client_artifacts.outputs.artifact_path }}
            ${{ steps.ubuntu_client_artifacts.outputs.checksum_path }}
            ${{ steps.agent_artifacts.outputs.artifact_path }}
            ${{ steps.agent_artifacts.outputs.checksum_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Attest Ubuntu artifacts
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: |
            ${{ steps.ubuntu_client_artifacts.outputs.artifact_path }}
            ${{ steps.agent_artifacts.outputs.artifact_path }}

  windows:
    name: Windows x64 client and agent
    if: needs.metadata.outputs.release == 'true'
    needs: metadata
    runs-on: windows-latest
    timeout-minutes: 70
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    env:
      MIMORII_ARTIFACT_DIR: ${{ github.workspace }}/dist/release/windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            apps/agent-desktop -> target
            apps/client/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows client
        run: pnpm tauri:windows:build

      - name: Build Windows agent
        run: cargo build --locked --release --manifest-path apps/agent-desktop/Cargo.toml

      - name: Verify unsigned Windows outputs
        shell: pwsh
        run: |
          $bundleDirectory = "apps/client/src-tauri/target/release/bundle"
          $paths = @(
            "apps/client/src-tauri/target/release/Mimorii.exe",
            "apps/agent-desktop/target/release/mimorii-agent-desktop.exe"
          )
          $paths += @(Get-ChildItem -Path $bundleDirectory -Recurse -File -Filter "*.msi").FullName
          $paths += @(Get-ChildItem -Path $bundleDirectory -Recurse -File -Filter "*-setup.exe").FullName
          if ($paths.Count -ne 4) {
            throw "Expected two application executables, one MSI, and one NSIS installer; found $($paths.Count) files."
          }
          foreach ($path in $paths) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Expected Windows output was not produced: $path"
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne "NotSigned") {
              throw "Expected unsigned Windows output, but Authenticode status is $($signature.Status): $path"
            }
          }
          $actualVersion = & apps/agent-desktop/target/release/mimorii-agent-desktop.exe --version
          $expectedVersion = "mimorii-agent-desktop ${{ needs.metadata.outputs.version }}"
          if ($actualVersion -ne $expectedVersion) {
            throw "Unexpected Windows agent version: $actualVersion"
          }

      - name: Stage Windows client artifacts
        id: windows_client_artifacts
        run: pnpm tauri:windows:stage

      - name: Package Windows agent
        id: windows_agent_artifacts
        shell: pwsh
        run: |
          $version = "${{ needs.metadata.outputs.version }}"
          $artifactName = "mimorii-agent-v$version-windows-x64.zip"
          $checksumName = "mimorii-agent-v$version-windows-x64.sha256"
          $outputDirectory = Join-Path $env:GITHUB_WORKSPACE "dist/release/windows-agent"
          $packageDirectory = Join-Path $env:RUNNER_TEMP "mimorii-agent-windows-x64"
          $artifactPath = Join-Path $outputDirectory $artifactName
          $checksumPath = Join-Path $outputDirectory $checksumName
          Remove-Item -LiteralPath $packageDirectory -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $packageDirectory, $outputDirectory -Force | Out-Null
          Copy-Item `
            -LiteralPath "apps/agent-desktop/target/release/mimorii-agent-desktop.exe" `
            -Destination $packageDirectory
          Compress-Archive -Path "$packageDirectory/*" -DestinationPath $artifactPath -CompressionLevel Optimal
          $digest = (Get-FileHash -LiteralPath $artifactPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $artifactName" | Set-Content -LiteralPath $checksumPath -Encoding utf8
          "artifact_path=$artifactPath" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "checksum_path=$checksumPath" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Name Windows artifact
        id: artifact
        run: echo "name=mimorii-windows-v${{ needs.metadata.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            ${{ steps.windows_client_artifacts.outputs.artifact_paths }}
            ${{ steps.windows_client_artifacts.outputs.checksum_path }}
            ${{ steps.windows_agent_artifacts.outputs.artifact_path }}
            ${{ steps.windows_agent_artifacts.outputs.checksum_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Generate Windows SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          artifact-name: sbom-mimorii-windows-v${{ needs.metadata.outputs.version }}.spdx.json
          output-file: ${{ runner.temp }}/mimorii-windows.spdx.json
          format: spdx-json
          upload-artifact-retention: 7
          upload-release-assets: false

      - name: Attest Windows artifacts
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: |
            ${{ steps.windows_client_artifacts.outputs.artifact_paths }}
            ${{ steps.windows_agent_artifacts.outputs.artifact_path }}

      - name: Attest Windows SBOM
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34
        with:
          subject-path: |
            ${{ steps.windows_client_artifacts.outputs.artifact_paths }}
            ${{ steps.windows_agent_artifacts.outputs.artifact_path }}
          sbom-path: ${{ runner.temp }}/mimorii-windows.spdx.json

  container:
    name: Publish ${{ matrix.component }} image
    if: >-
      ${{
        always() &&
        needs.metadata.result == 'success' &&
        needs.validation.result == 'success' &&
        (
          needs.metadata.outputs.release != 'true' ||
          (
            needs.android.result == 'success' &&
            needs.ubuntu.result == 'success' &&
            needs.windows.result == 'success'
          )
        )
      }}
    needs:
      - metadata
      - validation
      - android
      - ubuntu
      - windows
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    concurrency:
      group: mimorii-ghcr-${{ matrix.package }}-publish
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            context: .
            dockerfile: ./Dockerfile
            package: server
            title: Mimorii server
            description: Mimorii API and web client
          - component: check agent
            context: ./apps/agent-desktop
            dockerfile: ./apps/agent-desktop/Dockerfile
            package: check-agent
            title: Mimorii check agent
            description: Mimorii HTTP, TCP, and DNS check runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: image
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.package }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.metadata.outputs.version }},priority=1000,enable=${{ needs.metadata.outputs.release == 'true' }}
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable=${{ needs.metadata.outputs.release == 'true' && needs.metadata.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.metadata.outputs.sha }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}

      - name: Build and publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}
          annotations: ${{ steps.image.outputs.annotations }}
          cache-from: type=gha,scope=mimorii-${{ matrix.package }}
          cache-to: type=gha,mode=max,scope=mimorii-${{ matrix.package }}
          provenance: mode=max
          sbom: true

  publish:
    name: Publish GitHub release
    if: needs.metadata.outputs.release == 'true'
    needs:
      - metadata
      - android
      - ubuntu
      - windows
      - container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: github-release-${{ needs.metadata.outputs.tag }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Download Android artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ${{ needs.android.outputs.artifact_name }}
          path: release-assets

      - name: Download Ubuntu artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ${{ needs.ubuntu.outputs.artifact_name }}
          path: release-assets

      - name: Download Windows artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ${{ needs.windows.outputs.artifact_name }}
          path: release-assets

      - name: Validate release assets
        run: |
          version="${{ needs.metadata.outputs.version }}"
          expected=(
            "mimorii-agent-v${version}-linux-x64.sha256"
            "mimorii-agent-v${version}-linux-x64.tar.gz"
            "mimorii-agent-v${version}-windows-x64.sha256"
            "mimorii-agent-v${version}-windows-x64.zip"
            "mimorii-client-agent-v${version}-android-universal.apk"
            "mimorii-client-agent-v${version}-android-universal.apk.sha256"
            "mimorii-v${version}-ubuntu-x64.deb"
            "mimorii-v${version}-ubuntu-x64.deb.sha256"
            "mimorii-v${version}-windows-x64-setup.exe"
            "mimorii-v${version}-windows-x64.msi"
            "mimorii-v${version}-windows-x64.sha256"
          )
          mapfile -t actual < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "${actual[*]}" != "${expected[*]}" ]; then
            echo "::error::Release assets do not match the expected set."
            printf 'Expected: %s\n' "${expected[@]}"
            printf 'Actual: %s\n' "${actual[@]}"
            exit 1
          fi

      - name: Publish release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f | sort)
          existing_tag_commit="$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null || true)"
          if [ -n "$existing_tag_commit" ] && [ "$existing_tag_commit" != "$RELEASE_SHA" ]; then
            echo "::error::Tag $RELEASE_TAG points to $existing_tag_commit instead of $RELEASE_SHA."
            exit 1
          fi

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            exit 0
          fi

          release_args=(
            "$RELEASE_TAG"
            "${assets[@]}"
            --generate-notes
            --title "Mimorii $RELEASE_TAG"
          )
          if [ -n "$existing_tag_commit" ]; then
            release_args+=(--verify-tag)
          else
            release_args+=(--target "$RELEASE_SHA")
          fi
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            release_args+=(--prerelease)
          else
            release_args+=(--latest)
          fi
          gh release create "${release_args[@]}"
