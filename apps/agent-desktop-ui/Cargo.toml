[package]
name = "mimorii-agent-desktop-ui"
version = "7.1.0"
description = "Mimorii Agent desktop controls"
edition = "2024"
license = "MIT"

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.36.1", default-features = false, features = [
  "accesskit",
  "default_fonts",
  "glow",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
