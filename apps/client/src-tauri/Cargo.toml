[package]
name = "mimorii-client"
version = "10.0.0"
description = "Mimorii desktop and mobile client"
authors = ["Mimorii contributors"]
edition = "2024"

[lib]
name = "mimorii_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[features]
client-app = ["dep:tauri-plugin-push"]
mobile-agent = ["dep:tauri-plugin-agent-mobile", "dep:tauri-plugin-barcode-scanner"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11", features = [] }
tauri-plugin-agent-mobile = { path = "../../agent-mobile", optional = true }
tauri-plugin-push = { path = "plugins/push", optional = true }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = { version = "2.4", optional = true }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
