[package]
name = "mimorii-agent-desktop"
version = "2.1.0"
description = "Read-only Mimorii desktop relay and host metrics agent"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6.0"
hickory-resolver = "0.24"
ipnet = { version = "2.11", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.37"
time = { version = "0.3", features = ["formatting"] }
url = "2.5"
x509-parser = "0.18"

[dev-dependencies]
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
