[package]
name = "mimorii-agent-desktop"
version = "8.0.1"
description = "Read-only Mimorii desktop relay and host metrics agent"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bollard = "0.21.1"
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6.0"
flate2 = "1.1"
futures-util = "0.3"
glob = "0.3"
hickory-resolver = "0.24"
ipnet = { version = "2.11", features = ["serde"] }
mysql = { version = "28.0.0", default-features = false, features = [
  "minimal-rust",
  "rustls-tls-ring",
] }
postgres_rustls = "0.1.6"
redis = { version = "1.6.0", default-features = false, features = ["tls-rustls"] }
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
scraper = "0.24"
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
surge-ping = "0.9.0"
sysinfo = "0.37"
tar = "0.4"
tempfile = "3.23"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.51", features = ["macros", "net", "rt", "time"] }
tokio-postgres = "0.7"
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }
x509-parser = "0.18"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }

[dev-dependencies]
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
